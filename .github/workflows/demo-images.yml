name: Demo images

on:
  push:
    tags: ["feat/**"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: demo-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/offline-checks.yml

  publish:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: app
            image: chatnest
          - target: migrator
            image: chatnest-migrator
          - target: execution
            image: chatnest-execution
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify feature branch delivery
        env:
          REF: ${{ github.ref }}
        run: |
          case "$REF" in
            refs/tags/feat/*|refs/heads/feat/*) ;;
            *) echo "Select a feature branch or feat tag." >&2; exit 1 ;;
          esac
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish immutable revision
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/nodetime/${{ matrix.image }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
