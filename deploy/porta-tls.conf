server {
    listen 443 ssl;
    server_name porta-tls;
    ssl_certificate /etc/nginx/tls/porta.crt;
    ssl_certificate_key /etc/nginx/tls/porta.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location /mcp {
        proxy_pass http://porta:3334;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 120s;
    }
}
