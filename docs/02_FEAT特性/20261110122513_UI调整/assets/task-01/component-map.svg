<svg
  aria-labelledby="title description"
  height="640"
  role="img"
  viewBox="0 0 1200 640"
  width="1200"
  xmlns="http://www.w3.org/2000/svg"
>
  <title id="title">品牌资产与页面组件关系</title>
  <desc id="description">品牌 SVG 同时供共享页面组件和系统图标使用。</desc>
  <style>
  text {
    font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
  }
  </style>
  <rect data-graph-role="background" fill="#ffffff" height="640" width="1200" />
  <defs>
    <marker
      id="arrow"
      markerHeight="8"
      markerWidth="8"
      orient="auto"
      refX="7"
      refY="4"
    >
      <path d="M0 0 L8 4 L0 8 Z" fill="#2563eb" />
    </marker>
  </defs>
  <text fill="#111827" font-size="22" font-weight="600" x="40" y="44">
    UI-01 组件与资源关系
  </text>
  <text fill="#6b7280" font-size="14" font-weight="400" x="40" y="74">
    蓝色连线表示资源使用关系；本图为拟实施范围，不表示已完成修改。
  </text>
  <path
    d="M290 318 H368 V202 H460"
    data-graph-role="edge"
    fill="none"
    marker-end="url(#arrow)"
    stroke="#2563eb"
