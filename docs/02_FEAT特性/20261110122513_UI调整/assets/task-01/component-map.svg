  />
  <path
    d="M290 350 H368 V466 H460"
    data-graph-role="edge"
    fill="none"
    marker-end="url(#arrow)"
    stroke="#2563eb"
    stroke-width="2"
  />
  <path
    d="M740 202 H900"
    data-graph-role="edge"
    fill="none"
    marker-end="url(#arrow)"
    stroke="#2563eb"
    stroke-width="2"
  />
  <path
    d="M740 466 H900"
